<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eldermin</title>
    <!-- Used by the Class Diary rich-text editor's Urdu font toggle
         (RichTextEditor.tsx) so Urdu/Arabic text shapes correctly (joined
         letters) while a teacher is typing, not just in the downloaded PDF. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400..700&display=swap" rel="stylesheet" />
    <!-- Google Analytics (GA4) - loaded only when VITE_GA4_MEASUREMENT_ID is
         set at build time (Vite substitutes the %VITE_...% token from the
         env; an unset var becomes an empty string, so this is a safe no-op
         everywhere GA isn't configured, e.g. local dev). Visitor metrics
         surface in Super Admin > Analytics & Reports via the GA4 Data API
         (see eldermin-backend's GoogleAnalyticsService) - this tag is what
         actually generates that traffic data in the first place. -->
    <script>
      (function () {
        var GA_ID = "%VITE_GA4_MEASUREMENT_ID%";
        if (!GA_ID) return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', GA_ID);
      })();
    </script>
  </head>
  <body>
    <!-- Plain CSS, no JS - visible the instant the HTML itself paints,
         before the app bundle has even started downloading. Without this
         a slow connection shows a blank white tab for however long that
         takes, which is indistinguishable from "the tab won't open" -
         exactly the complaint this is here to prevent. React's first
         render (src/main.tsx) replaces #root's contents entirely, so
         this never lingers once the real app has mounted. -->
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;width:100%;height:100vh;background:#f8fafc;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
          <div style="width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#0C447C;border-radius:50%;animation:eldermin-spin 0.8s linear infinite;"></div>
          <p style="font:500 12px system-ui,sans-serif;color:#94a3b8;margin:0;">Loading…</p>
        </div>
      </div>
    </div>
    <style>@keyframes eldermin-spin { to { transform: rotate(360deg); } }</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
